name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore YtAudioDownloader.csproj

      - name: Build
        run: dotnet build YtAudioDownloader.csproj --configuration Release

      - name: Publish self-contained app
        run: dotnet publish YtAudioDownloader.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:PublishTrimmed=false -o publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt-audio-downloader-publish
          path: publish
